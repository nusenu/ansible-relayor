---

- hosts: relays
  vars:
    #tor_ContactInfo: relayor-example@example.com
    tor_signingkeylifetime_days: 90
    tor_nickname: "{{ ansible_hostname }}"
    tor_instance_limit: 4
    tor_ports:
      - orport: 9000
        dirport: 9001
      - orport: 9100
        dirport: 9101
      - orport: 9200
        dirport: 9201
      - orport: 9300
        dirport: 9301
  roles:
   - nusenu.relayor
