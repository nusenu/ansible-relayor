---
- name: Use a single private IPv4 address if we have no public IPv4 address
  ansible.builtin.include_vars: private_IPv4_only.yml
  when: tor_v4ips == []

- name: Setup IP list (1/2)
  ansible.builtin.set_fact:
    ips:
      ipv4: "{{ item.0 }}"
      ipv4_int: "{{ item.0 | ansible.utils.ipaddr('int') }}"
      ipv6: "{{ item.1 }}"
  with_together:
    - "{{ tor_v4ips }}"
    - "{{ tor_v6ips }}"
  register: tor_ipsinterm

- name: Setup IP list (2/2)
  ansible.builtin.set_fact:
    tor_ips: "{{ tor_ipsinterm.results | map(attribute='ansible_facts.ips') | list }}"

- name: Setup tor instance list (1/2)
  ansible.builtin.set_fact:
    tor_instances_interm: "{{ tor_ips | product(tor_ports) | map('combine') | sort(attribute='ipv4_int') }}"

- name: Setup tor instance list (2/2)
  ansible.builtin.set_fact:
    tor_instances: "{{tor_instances_interm[0:tor_instance_limit] }}"

- name: Display actual tor instance count and used IPv4 addresses
  debug:
    msg: "relayor will manage {{tor_instances|length }} tor instances on this server using
          the following IPv4 addresses in shown order: {{ tor_instances | map(attribute='ipv4')|unique }}"

- name: Ensure we have enough logical cores for CPU affinity
  ansible.builtin.assert:
    that:
      - tor_instances|length <= ansible_processor_vcpus
    msg: "You can not use tor_cpu_affinity on this system, because it requires at least {{tor_instances|length }} CPU cores/threads
          and you only have {{ansible_processor_vcpus}}. You have to disable tor_cpu_affinity or reduce the number of tor instances (tor_instance_limit)."
  when: tor_cpu_affinity and ansible_system == 'Linux'
